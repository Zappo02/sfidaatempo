*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body,#root{height:100%;margin:0}
button{font-family:inherit}
.tnum{font-variant-numeric:tabular-nums}
.app{
  --radius:18px;
  min-height:100%;height:100dvh;overflow:hidden;
  color:var(--text);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  display:flex;flex-direction:column;position:relative;
  transition:background .35s ease,color .35s ease;
}
.app.dark{
  --text:#ffffff;--muted:#97a1bd;--faint:#616c8f;
  --panel:rgba(255,255,255,.05);--panel-2:rgba(255,255,255,.085);--line:rgba(255,255,255,.11);
  --ok:#2fd98a;--ko:#ff5470;--gold:#ffb01f;--warn:#ff8a3d;
  --tile:rgba(255,255,255,.07);--ink:#e9ecf6;
  --shadow:0 10px 34px rgba(0,0,0,.55);
  background:
    radial-gradient(90% 60% at 10% 0%, #16203a 0%, rgba(7,9,16,0) 60%),
    radial-gradient(90% 60% at 90% 100%, #241428 0%, rgba(7,9,16,0) 60%),
    #070910;
  color-scheme:dark;
}
.app.light{
  --text:#111522;--muted:#5d6681;--faint:#8a93ab;
  --panel:#ffffff;--panel-2:#f1f3fa;--line:rgba(17,21,34,.1);
  --ok:#0f9d58;--ko:#e0344f;--gold:#b8780a;--warn:#d4651a;
  --tile:#e8ebf4;--ink:#1d2233;
  --shadow:0 8px 26px rgba(17,21,34,.1);
  background:
    radial-gradient(90% 60% at 10% 0%, #e3ecff 0%, rgba(244,246,251,0) 62%),
    radial-gradient(90% 60% at 90% 100%, #ffe8ee 0%, rgba(244,246,251,0) 62%),
    #f4f6fb;
  color-scheme:light;
}
.theme-btn{flex:0 0 auto;width:36px;height:36px;border-radius:12px;cursor:pointer;
  border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:17px;line-height:1;display:grid;place-items:center;box-shadow:var(--shadow)}
.theme-btn:active{transform:scale(.92)}

/* HOME */
.home{flex:1;display:flex;flex-direction:column;padding:62px 20px 22px;overflow-y:auto;max-width:520px;width:100%;margin:0 auto}
.brand{font-size:10px;letter-spacing:.3em;color:var(--faint);font-weight:800;margin-top:auto}
.title{font-size:clamp(32px,9.5vw,50px);line-height:1;margin:8px 0 0;font-weight:800;letter-spacing:-.035em;text-wrap:balance}
.amp{background:linear-gradient(90deg,var(--ko),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;font-style:italic;padding-right:4px}
.tagline{color:var(--muted);font-size:13.5px;margin:10px 0 18px;line-height:1.45}
.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--panel-2);border:1px solid var(--line);align-self:flex-start}
.seg button{border:0;background:none;color:var(--muted);font-weight:800;font-size:13px;padding:8px 16px;border-radius:10px;cursor:pointer}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:var(--shadow)}
.app.dark .seg button.on{background:rgba(255,255,255,.12)}
.sect{font-size:10px;letter-spacing:.2em;color:var(--faint);font-weight:800;margin:18px 0 9px}
.daily-card{width:100%;text-align:left;cursor:pointer;color:var(--text);border:1px solid var(--line);border-radius:var(--radius);padding:16px;
  background:linear-gradient(135deg,rgba(255,176,31,.14),rgba(255,84,112,.1)),var(--panel);box-shadow:var(--shadow);display:flex;align-items:center;gap:14px}
.daily-card:active,.mode-card:active{transform:scale(.985)}
.daily-ico{font-size:24px;width:46px;height:46px;flex:0 0 auto;border-radius:14px;display:grid;place-items:center;background:var(--panel-2);border:1px solid var(--line)}
.daily-body{flex:1;min-width:0;display:flex;flex-direction:column}
.daily-h{font-weight:800;font-size:16px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.pill{font-size:9.5px;font-weight:800;letter-spacing:.1em;padding:3px 7px;border-radius:999px;background:var(--gold);color:#1b1206}
.daily-s{font-size:12px;color:var(--muted);margin-top:3px}
.daily-go,.mode-go{font-size:24px;color:var(--faint);line-height:1}
.modes{display:flex;flex-direction:column;gap:10px}
.mode-card{display:flex;align-items:center;gap:13px;width:100%;padding:14px;border-radius:var(--radius);border:1px solid var(--line);
  background:var(--panel);color:var(--text);cursor:pointer;text-align:left;box-shadow:var(--shadow)}
.mode-icon{font-size:20px;width:42px;height:42px;display:grid;place-items:center;border-radius:13px;background:var(--panel-2);border:1px solid var(--line);flex:0 0 auto}
.mode-text{flex:1;min-width:0;display:flex;flex-direction:column}
.mode-label{font-weight:700;font-size:15.5px}
.mode-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.mode-rec{font-size:11px;color:var(--gold);font-weight:800;white-space:nowrap}
.links{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.links button{flex:1;min-width:96px;padding:11px 8px;border-radius:13px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-weight:700;font-size:12.5px;cursor:pointer}
.foot{margin:22px 0 auto;padding-top:4px;text-align:center;font-size:10.5px;color:var(--faint);letter-spacing:.05em;line-height:1.6}

/* HUD */
.game{flex:1;display:flex;flex-direction:column;min-height:0}
.hud{display:flex;flex-direction:column;gap:3px;padding:8px 10px 6px;flex:0 0 auto;max-width:620px;width:100%;margin:0 auto}
.hud-back{background:none;border:0;color:var(--muted);font-size:28px;line-height:1;cursor:pointer;padding:0 6px}
.hud-mode{font-size:11.5px;color:var(--muted);font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-score{display:flex;align-items:center;gap:10px}
.hud-streak{font-size:20px;font-weight:800;line-height:1}
.clock{font-size:15px;font-weight:800;padding:4px 9px;border-radius:9px;background:var(--panel-2);border:1px solid var(--line)}
.clock.low{color:var(--ko);border-color:var(--ko)}
.hearts{color:var(--ko);font-size:16px;letter-spacing:2px}
.hearts i{font-style:normal;color:var(--line)}
.dots{display:flex;gap:5px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dot.ok{background:var(--ok)}.dot.ko{background:var(--ko)}
.dot.now{background:var(--muted);box-shadow:0 0 0 2px var(--panel-2)}
.tbar{height:3px;background:var(--line);flex:0 0 auto}
.tbar div{height:100%;background:linear-gradient(90deg,var(--ko),var(--gold));transition:width .1s linear}

/* GIOCO */
.play{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:12px;padding:6px 12px 16px;max-width:620px;width:100%;margin:0 auto}
.round-label{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--faint);display:flex;gap:10px;align-items:center}
.flash{color:var(--gold);letter-spacing:.05em;animation:pop .3s ease}
@keyframes pop{from{transform:scale(1.5);opacity:0}to{transform:none;opacity:1}}
.key:focus-visible,.btn:focus-visible,.hint:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.verdict-box{width:100%;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:var(--panel);text-align:center}
.vb-h{font-weight:900;font-size:14px;letter-spacing:.14em;text-transform:uppercase}
.verdict-box.won .vb-h{color:var(--ok)}.verdict-box.lost .vb-h{color:var(--ko)}
.vb-p{font-size:12.5px;color:var(--muted);margin-top:3px}
.vb-p b{color:var(--text)}

.btn{min-width:206px;padding:12px 20px;border-radius:14px;border:1px solid var(--line);background:var(--panel-2);color:var(--text);font-size:13.5px;font-weight:800;letter-spacing:.03em;cursor:pointer}
.btn.primary{background:linear-gradient(90deg,var(--ko),var(--gold));color:#1b0a0a;border:0}
.btn.ghost{background:none}
.next{width:100%}

/* RIEPILOGHI */
.summary{justify-content:center;text-align:center;gap:10px}
.sum-k{font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:800;color:var(--faint)}
.sum-big{font-size:68px;font-weight:900;letter-spacing:-.05em;line-height:1}
.sum-big span{font-size:30px;color:var(--faint)}
.sum-sub{color:var(--muted);font-size:13px}
.sum-last{font-size:13px;color:var(--muted)}
.sum-list{display:flex;flex-direction:column;gap:6px;width:100%;max-width:400px;margin:8px 0}
.sum-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);text-align:left}
.sum-n{flex:1;font-weight:700;font-size:13.5px;min-width:0}
.sum-x{font-size:11.5px;color:var(--muted)}
.share-pre{font-family:inherit;font-size:12px;color:var(--muted);background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:4px 0;white-space:pre-wrap;user-select:all}
.next-in{font-size:12px;color:var(--muted)}

/* LISTE */
.list-wrap{flex:1;overflow-y:auto;padding:6px 18px 24px;max-width:560px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:7px}
.empty,.note{color:var(--muted);font-size:13px;line-height:1.5}
.arc-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:13px;border:1px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer;text-align:left}
.arc-n{font-weight:800;width:40px}
.arc-d{flex:1;color:var(--muted);font-size:13px}
.arc-s{font-size:12px;font-weight:800;color:var(--faint)}
.arc-s.done{color:var(--ok)}.arc-s.part{color:var(--gold)}
.stat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.stat-grid div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center;display:flex;flex-direction:column}
.stat-grid b{font-size:22px}
.stat-grid span{font-size:10.5px;color:var(--muted)}
.dist{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.dist-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.dist-row>span{width:28px}
.dist-bar{flex:1}
.dist-bar div{min-width:24px;background:var(--panel-2);border-radius:6px;padding:3px 7px;text-align:right}
.dist-bar b{font-size:11.5px;color:var(--text)}
.rec-row{display:flex;justify-content:space-between;padding:12px 14px;border-radius:13px;background:var(--panel);border:1px solid var(--line);font-size:14px}
.rec-row b{color:var(--gold)}
.rules p{font-size:14px;line-height:1.55;color:var(--muted);margin:0 0 6px;max-width:62ch}
.rules b{color:var(--text)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* SFIDA A TEMPO */
.cat-card{width:100%;padding:16px 16px 14px;border-radius:var(--radius);border:1px solid var(--line);box-shadow:var(--shadow);
  background:linear-gradient(135deg,rgba(255,176,31,.14),rgba(255,84,112,.1)),var(--panel)}
.cat-k{font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:800;color:var(--gold)}
.cat-t{margin:5px 0 3px;font-size:clamp(18px,5.4vw,23px);line-height:1.15;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.cat-d{font-size:12.5px;color:var(--muted)}
.cat-prog{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:13px;color:var(--muted)}
.cat-prog b{color:var(--text);font-size:17px}
.pbar{flex:1;height:8px;border-radius:99px;background:var(--line);position:relative;overflow:visible}
.pbar>div{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--ko),var(--gold));transition:width .35s ease}
.pbar .tgt{position:absolute;top:-4px;width:3px;height:16px;border-radius:2px;background:var(--text);transform:translateX(-1px)}
.guess{display:flex;gap:8px;width:100%}
.guess input{flex:1;min-width:0;height:50px;padding:0 15px;border-radius:14px;border:1.5px solid var(--line);background:var(--panel-2);color:var(--text);
  font:700 16px/1 inherit;font-family:inherit;outline:none;transition:border-color .15s}
.app.light .guess input{background:#fff}
.guess input:focus{border-color:var(--gold)}
.guess.bad input{border-color:var(--ko)}
.guess.good input{border-color:var(--ok)}
.send{height:50px;padding:0 18px;border-radius:14px;border:0;background:linear-gradient(90deg,var(--ko),var(--gold));color:#1b0a0a;font-weight:900;font-size:14px;cursor:pointer}
.send:disabled{opacity:.4;cursor:default}
.fb-line{min-height:20px;font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:8px;animation:pop .25s ease}
.fb-line.ok{color:var(--ok)}.fb-line.no,.fb-line.dup{color:var(--ko)}
.fb-line.no,.fb-line.dup{animation:shake .35s ease}
.fb-line .muted{color:var(--faint);font-weight:600}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.bonus{font-size:11px;font-weight:900;padding:2px 7px;border-radius:999px;background:var(--ok);color:#06150d}
.chips{display:flex;flex-wrap:wrap;gap:6px;width:100%;justify-content:center}
.chip{padding:6px 11px;border-radius:999px;font-size:12.5px;font-weight:700;border:1px solid var(--line);animation:chipIn .25s ease}
@keyframes chipIn{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
.chip.ok{background:rgba(47,217,138,.13);color:var(--ok);border-color:rgba(47,217,138,.35)}
.app.light .chip.ok{background:#e7f7ee;border-color:#b9e8cd}
.chip.ko{background:rgba(255,84,112,.1);color:var(--ko);border-color:rgba(255,84,112,.3);animation:none}
.app.light .chip.ko{background:#fdecef;border-color:#f6c3cc}
.row-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.mini{padding:7px 13px;border-radius:11px;border:1px solid var(--line);background:none;color:var(--muted);font-size:12px;font-weight:700;cursor:pointer}
.mini.danger{border-color:var(--ko);color:var(--ko)}
.mini.go{border:0;background:var(--ok);color:#06150d;font-weight:900}
.mini-q{font-size:12px;color:var(--text);font-weight:700}
.intro-ico{font-size:44px;line-height:1}
.intro-h{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.intro-p{margin:0 0 6px;max-width:36ch;color:var(--muted);font-size:14px;line-height:1.5}
.intro-p b{color:var(--text)}
.sum-block{width:100%;max-width:460px;display:flex;flex-direction:column;align-items:center}
.sect.tight{margin:10px 0 7px}
.arc-d small{display:block;font-size:11.5px;color:var(--faint);margin-top:2px}
.arc-t{flex:1;font-size:13.5px;font-weight:700;min-width:0}
.arc-row.rnd{background:linear-gradient(135deg,rgba(255,176,31,.14),rgba(255,84,112,.1)),var(--panel)}
.stat-grid b{font-size:20px}
.dist-row>span{width:58px}
.summary{justify-content:flex-start}
.summary>:first-child{margin-top:auto}
.summary>:last-child{margin-bottom:auto}

/* LINGUA, HUD, TUTTI I GIOCHI */
.corner{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.corner.floating{position:absolute;top:12px;right:12px;z-index:20}
.lang{display:flex;gap:2px;padding:3px;height:36px;border-radius:12px;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow)}
.lang button{border:0;background:none;color:var(--muted);font-family:inherit;font-weight:800;font-size:11.5px;letter-spacing:.06em;padding:0 9px;border-radius:9px;cursor:pointer}
.lang button.on{color:var(--text);background:var(--tile)}
.lang button:focus-visible,.theme-btn:focus-visible,.all-games:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.hud-top{display:flex;align-items:center;gap:8px;min-width:0}
.hud .hud-score{justify-content:space-between;padding:0 6px 0 8px;min-height:28px}
.all-games{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:10px;padding:14px 12px;border-radius:14px;
  border:1px solid var(--line);background:var(--panel-2);color:var(--text);text-decoration:none;
  font-weight:800;font-size:clamp(12.5px,3.7vw,14px);letter-spacing:.01em;white-space:nowrap}
.app.light .all-games{background:#fff}
.all-games span{color:var(--gold);font-size:20px;line-height:1;margin-top:-2px}
.all-games:active{transform:scale(.985)}
/* Dentro un iframe del sito: altezza naturale, la pagina madre ridimensiona l'iframe. */
html.autoheight,html.autoheight body,html.autoheight #root{height:auto}
html.autoheight .app{height:auto;min-height:640px;overflow:visible}
html.autoheight .home,html.autoheight .play,html.autoheight .list-wrap{overflow:visible}
